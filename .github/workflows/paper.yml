name: Draft JOSS paper

# Builds paper/paper.md into a PDF on every change, so the manuscript never
# breaks silently. Artifact is downloadable from the Actions run.
on:
  push:
    paths: ['paper/**', '.github/workflows/paper.yml']
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build draft PDF
        # @master is what the JOSS documentation itself prescribes for this action;
        # upstream publishes no maintained version tag.  Checked 2026-09-02.
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
