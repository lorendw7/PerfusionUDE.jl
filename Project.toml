# Heavy / optional functionality lives behind package extensions so that the base
# package installs, loads and tests on a CPU-only machine.  See
# docs/src/design/12-package-design.md §12.2 — a JOSS reviewer will not have a GPU.
[weakdeps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
DiffEqGPU = "071ae1c0-96b5-11e9-1965-c90190d839ea"
StructuralIdentifiability = "220ca800-aa68-49bb-acd8-6037fa93a544"
SymbolicRegression = "8254be44-1295-4e6a-a16d-46603ac705cb"

[extensions]
PerfusionUDECUDAExt = ["CUDA", "DiffEqGPU"]
PerfusionUDEIdentifiabilityExt = "StructuralIdentifiability"
PerfusionUDESymbolicExt = "SymbolicRegression"

[compat]
CUDA = "5, 6"
ComponentArrays = "0.15"
DiffEqCallbacks = "4"
DiffEqGPU = "3"
Distributions = "0.25"
Lux = "1"
OrdinaryDiffEq = "7"
SciMLBase = "3"
SciMLSensitivity = "7"
StaticArrays = "1"
StructuralIdentifiability = "0.5"
SymbolicRegression = "1, 2"
julia = "1.10"

[extras]
